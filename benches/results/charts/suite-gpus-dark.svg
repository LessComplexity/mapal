<title id="t">Kernel and layer suite: Mapal against the fastest same-precision competitor</title>
<desc id="d">Geometric mean of Mapal time divided by the fastest competitor's time, per GPU: RTX 5080 0.876; RTX 3090 0.996; A100 1.185; RTX 4090 0.954; H100 1.205</desc>
