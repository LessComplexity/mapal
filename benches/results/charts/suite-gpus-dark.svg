<title id="t">Kernel and layer suite: Mapal against the fastest same-precision competitor</title>
<desc id="d">Geometric mean of Mapal time divided by the fastest competitor's time, per GPU: RTX 5080 0.876; RTX 3090 0.920; A100 1.006; RTX 4090 0.911; H100 1.101</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
