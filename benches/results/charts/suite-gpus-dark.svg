<text x="28.0" y="60.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Geomean of Mapal time ÷ the fastest competitor's time over the 119 programs timed on every GPU. Below 1: Mapal faster.</text>
<text x="28.0" y="78.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Each program against competitors of its own precision: cuBLAS(Lt), CUTLASS, PyTorch eager / compiled, Triton, FlashAttention, FlashInfer, Liger.</text>
