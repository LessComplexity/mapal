<title id="t">Llama-3.2-1B-Instruct on an RTX 5080: bf16 class</title>
<desc id="d">Time to first token and decode time per token for Mapal, gpt-fast, SGLang, TensorRT-LLM, vLLM, llama.cpp bf16, llama.cpp f16, HF eager, HF static + compile, at prompt lengths 128, 512, 2048. Mapal with bf16 operands and f32 accumulation on the sums of products (fold: bf16 | f32). The other engines run bf16 (llama.cpp f16: f16).</desc>
