<svg xmlns="http://www.w3.org/2000/svg" width="920" height="618" viewBox="0 0 920 618" role="img" aria-labelledby="t d">
<title id="t">Llama-3.2-1B, f32 class: Mapal against the fastest f32 engine</title>
<desc id="d">Mapal as written (f32 activations on the bf16 weights, within the default face's bound) against the f32-compute engines, TF32 off. Time to first token, 512-token prompt: RTX 5080 0.62 (25.4 vs 41.0 ms, vLLM f32); RTX 3090 0.95 (56.0 vs 58.8 ms, llama.cpp f32); A100 0.52 (40.0 vs 76.8 ms, vLLM f32); RTX 4090 0.64 (20.1 vs 31.6 ms, vLLM f32); H100 0.74 (21.8 vs 29.6 ms, HF eager f32). Decode, per generated token, 512-token prompt: RTX 5080 0.58 (3.29 vs 5.72 ms, gpt-fast f32); RTX 3090 0.66 (4.04 vs 6.15 ms, gpt-fast f32); A100 0.91 (3.82 vs 4.21 ms, gpt-fast f32); RTX 4090 0.63 (3.47 vs 5.54 ms, gpt-fast f32); H100 0.95 (2.06 vs 2.16 ms, gpt-fast f32).</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
