name: CI

# Every push: the quick checks and the suite without its slow tests (~1,730 of ~1,860 tests).
# The slow ones — generated-program tests that run many programs through the CPU emulator,
# ~98% of the suite's time — run nightly in full-tests.yml. The list is .config/slow-tests.txt
# (scripts/slow_tests.py builds .config/nextest.toml from it).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A superseded run proves nothing about the tip. Newest commit per ref wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No code file under crates/ or editors/ over 1,000 lines.
      - name: File size
        run: scripts/check_file_size.sh
      # The Architecture Map's every code reference still resolves to one definition, and the page is current.
      - name: Architecture map
        run: python3 docs/tools/archmap.py --check
      # .config/nextest.toml is what the slow-test list gives.
      - name: Test config
        run: python3 scripts/slow_tests.py --check
      - name: Formatting
        run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The LLVM backend's differential tests compile and run the emitted programs with clang; they skip
      # themselves without it (MAPAL_REQUIRE_CLANG turns the skip into a failure). lld: Linux's default
      # GNU ld makes linking ~60% of a case. macOS runners ship clang.
      - name: Install clang + lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Test (quick)
        run: cargo nextest run --workspace --release --profile quick
        env:
          MAPAL_REQUIRE_CLANG: 1
          MAPAL_LD: ${{ runner.os == 'Linux' && 'lld' || '' }}

  # The CUDA backend's tests skip themselves without nvcc, which hosted runners lack; compiling them
  # still catches emitter-wiring breaks.
  cuda-builds:
    name: cuda backend compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mapal-backend-cuda
      - run: cargo test --release -p mapal-backend-cuda --no-run
