[workspace]
resolver = "3"
members = [
    "crates/mapal-syntax",
    "crates/mapal-ir",
    "crates/mapal-lower",
    "crates/mapal-check",
    "crates/mapal-interp",
    "crates/mapal-rt",
    "crates/mapal-rewrite",
    "crates/backends/llvm",
    "crates/backends/cuda",
    "crates/backends/verilog",
    "crates/mapal-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

# The interpreter is the tests' oracle (budgets up to 400M steps): optimized in test builds,
# checks kept (debug-assertions / overflow-checks come from the dev profile). Measured:
# differential suite 777 -> 683 s; rebuild cost 2 s.
[profile.dev.package.mapal-interp]
opt-level = 3
